<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ターフ1984">
<meta name="theme-color" content="#0c1712">
<title>ターフヒストリー1984</title>
<style>
 body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#0c1712; color:#edf5f0; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; }
 .box { max-width:340px; }
 .sp { width:40px; height:40px; border:4px solid #223f31; border-top-color:#e6be5c; border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
 @keyframes spin { to { transform:rotate(360deg); } }
 .err { color:#ff9c9c; font-size:13px; margin-top:12px; display:none; word-break:break-all; }
 button { margin-top:12px; padding:10px 18px; border:none; border-radius:10px; background:#e6be5c; color:#151208; font-weight:700; font-size:14px; display:none; }
</style>
</head>
<body>
<div class="box">
 <div class="sp" id="sp"></div>
 <div id="msg" style="font-weight:700;color:#e6be5c;">ターフヒストリー1984を起動中...</div>
 <div class="err" id="err"></div>
 <button id="retry" onclick="location.reload()">再読み込み</button>
</div>
<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxJnnYmpDxA62LQWbifAJMQRt1rzbufdFfMIaG82NyQpc07r2JnmWp3u3m_9DjjFYNo/exec';

(async function boot() {
 try {
  const res = await fetch(GAS_API_URL + '?t=' + Date.now(), { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  let payload;
  try {
   payload = JSON.parse(text);
  } catch (e) {
   throw new Error('GASからJSON以外が返りました。アクセス権を「全員」にして新バージョンデプロイしてください。');
  }
  if (payload.error) throw new Error(payload.error);
  if (!payload.html) throw new Error('アプリHTMLが取得できませんでした。');
  try {
   sessionStorage.setItem('turf1984_api_url', GAS_API_URL);
   if (payload.data) sessionStorage.setItem('turf1984_preload_data', JSON.stringify(payload.data));
   localStorage.setItem('turf1984_cached_html', payload.html);
  } catch (e) {}
  document.open();
  document.write(payload.html);
  document.close();
 } catch (e) {
  document.getElementById('sp').style.display = 'none';
  document.getElementById('msg').textContent = '起動に失敗しました';
  const errEl = document.getElementById('err');
  errEl.textContent = e.message || String(e);
  errEl.style.display = 'block';
  document.getElementById('retry').style.display = 'inline-block';
 }
})();
</script>
</body>
</html>
